name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint and run the checks on PHP 8.5
        run: |
          docker run --rm -v "$PWD:/app" -w /app php:8.5-cli sh -c '
            for f in $(find . -name "*.php" -not -path "./.git/*"); do php -l "$f" > /dev/null || exit 1; done
            php tests/check.php'

      - name: Build the image and check it serves pages
        run: |
          docker build -t reposcope .
          docker run -d --name app -p 8080:80 reposcope
          # wait for Apache to accept connections
          curl -s -o /dev/null --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/
          expect() {
            code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ]
          }
          # Apache refuses "../" paths outright with 400
          expect / 200 && expect /analyze.php 200 && expect /no-such-page 404 \
            && expect /config/config.php 404 && expect /../config/config.php 400 \
            || { docker logs app; exit 1; }
